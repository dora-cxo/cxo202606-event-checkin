<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>活動自助報到</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root{
  --primary:#e07b39;--primary-dark:#c4622a;--primary-light:#fdf0e8;
  --grad:#linear-gradient(135deg,#f5a96a,#e07b39,#c4622a);
  --grad-btn:linear-gradient(135deg,#f5a96a,#e07b39,#c4622a);
  --grad-green:linear-gradient(135deg,#6fcf97,#27ae60,#1a8a47);
  --grad-hero:linear-gradient(160deg,#f5a96a 0%,#e07b39 45%,#c4622a 100%);
  --success:#1a8a47;--success-light:#eafaf1;
  --danger:#c0392b;--danger-light:#fdecea;
  --w50:#fff8f2;--w100:#fdeede;--w200:#fad5b0;--w600:#c4622a;--w700:#9e4b1e;--w800:#7a3614;
  --g100:#f3f0eb;--g200:#e5e0d8;--g300:#d0c9be;--g400:#a89f93;--g500:#7d7368;--g600:#5c5349;--g700:#3e3730;--g800:#2a2320;
  --radius:14px;--radius-lg:20px;
  --shadow:0 4px 20px rgba(180,100,40,.12);--shadow-lg:0 8px 40px rgba(180,100,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;background:var(--grad-hero);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem}

/* CARD */
.card{background:white;border-radius:var(--radius-lg);width:100%;max-width:420px;overflow:hidden;box-shadow:var(--shadow-lg)}
.card-header{background:white;padding:1.5rem 1.75rem 1.25rem;text-align:center;border-bottom:1px solid var(--w100)}
.card-header .logo-wrap{background:var(--g900,#1a1512);border-radius:12px;padding:.75rem 1.25rem;display:inline-block;margin-bottom:.9rem}
.card-header .logo-wrap img{height:56px;width:auto;display:block}
.card-header .event-name{font-size:1rem;font-weight:900;letter-spacing:-.3px;margin-bottom:.2rem;min-height:1.3em;color:var(--g800)}
.card-header .event-sub{font-size:.75rem;color:var(--g400)}
.card-header .open-badge{display:inline-flex;align-items:center;gap:.3rem;background:var(--success-light);color:var(--success);border:1px solid #86efac;border-radius:100px;padding:.2rem .65rem;font-size:.72rem;font-weight:700;margin-top:.4rem}
.card-body{padding:1.75rem}

/* SCREENS */
.screen{display:none}.screen.active{display:block}

/* WAITING SCREEN */
.waiting-wrap{text-align:center;padding:1rem 0}
.waiting-icon{font-size:3.5rem;margin-bottom:1rem}
.waiting-title{font-size:1.1rem;font-weight:800;color:var(--w800);margin-bottom:.4rem}
.waiting-sub{font-size:.85rem;color:var(--g400);margin-bottom:1.5rem;line-height:1.6}
.countdown-box{background:var(--w50);border:1.5px solid var(--w200);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
.countdown-label{font-size:.72rem;color:var(--g400);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:.5rem}
.countdown-time{font-size:2.2rem;font-weight:900;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.time-range{font-size:.8rem;color:var(--g400);margin-top:.4rem}
.closed-box{background:var(--danger-light);border:1.5px solid #fca5a5;border-radius:var(--radius);padding:1rem;text-align:center}
.closed-box p{font-size:.85rem;color:var(--danger);font-weight:600}

/* INPUT SCREEN */
.tab-switch{display:flex;background:var(--g100);border-radius:10px;padding:3px;margin-bottom:1.5rem;gap:3px}
.tab-btn{flex:1;padding:.55rem;font-size:.82rem;font-weight:700;border:none;border-radius:8px;cursor:pointer;background:none;color:var(--g400);transition:all .15s}
.tab-btn.active{background:white;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.78rem;font-weight:700;color:var(--g600);margin-bottom:.4rem}
.form-input{width:100%;padding:.85rem 1rem;border:1.5px solid var(--g200);border-radius:var(--radius);font-size:1rem;outline:none;background:white;color:var(--g800);transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(224,123,57,.12)}
.form-input.error{border-color:var(--danger);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.form-input::placeholder{color:var(--g300)}
.error-msg{font-size:.78rem;color:var(--danger);font-weight:600;margin-top:.35rem;display:none}
.error-msg.show{display:block}
.btn{width:100%;padding:.9rem;border:none;border-radius:var(--radius);font-size:1rem;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:.5rem}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad-btn);color:white;box-shadow:0 4px 16px rgba(224,123,57,.35)}
.btn-primary:hover{opacity:.9}
.btn-gray{background:var(--g100);color:var(--g500);margin-top:.6rem}
.lock-warn{background:var(--danger-light);border:1px solid #fca5a5;border-radius:10px;padding:.75rem 1rem;font-size:.82rem;color:var(--danger);font-weight:600;text-align:center;margin-bottom:1rem;display:none}
.lock-warn.show{display:block}
.attempt-hint{font-size:.75rem;color:var(--g400);text-align:center;margin-top:.6rem}

/* CONFIRM SCREEN */
.confirm-card{background:var(--w50);border:1.5px solid var(--w200);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem}
.confirm-row{display:flex;align-items:center;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--w100)}
.confirm-row:last-child{border-bottom:none}
.confirm-label{font-size:.78rem;color:var(--g400);font-weight:600}
.confirm-val{font-size:.9rem;font-weight:800;color:var(--g900)}
.confirm-name-big{font-size:1.5rem;font-weight:900;color:var(--w800);text-align:center;padding:.75rem 0;border-bottom:1px solid var(--w100);margin-bottom:.5rem}
.confirm-warn{font-size:.78rem;color:var(--warning,#b7770d);background:#fef9ec;border-radius:8px;padding:.6rem .75rem;text-align:center;margin-bottom:1rem;border:1px solid #fcd34d}

/* SUCCESS SCREEN */
.success-screen{background:var(--grad-hero);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.success-card{background:white;border-radius:var(--radius-lg);width:100%;max-width:360px;overflow:hidden;box-shadow:var(--shadow-lg)}
.success-top{background:var(--grad-hero);padding:1.75rem 1.5rem 1.5rem;text-align:center;color:white}
.success-logo{background:rgba(255,255,255,.15);border-radius:10px;padding:.5rem .9rem;display:inline-block;margin-bottom:.9rem;backdrop-filter:blur(4px)}
.success-logo img{height:36px;width:auto;display:block}
.success-icon{font-size:3rem;margin-bottom:.4rem;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.success-big{font-size:1.6rem;font-weight:900;animation:slideUp .4s ease .1s both;letter-spacing:-.3px}
.success-sub{font-size:.85rem;opacity:.85;margin-top:.3rem;animation:slideUp .4s ease .15s both}
.success-body{padding:1.5rem}
.success-info{background:var(--w50);border-radius:var(--radius);padding:1.1rem 1.25rem;margin-bottom:1.25rem;border:1px solid var(--w100)}
.success-row{display:flex;align-items:center;justify-content:space-between;padding:.35rem 0}
.success-row+.success-row{border-top:1px solid var(--w100)}
.s-label{font-size:.75rem;color:var(--g400);font-weight:600}
.s-val{font-size:.88rem;font-weight:800;color:var(--g900)}
.screenshot-hint{background:linear-gradient(135deg,#fef9ec,#fef3c7);border:1.5px solid #fcd34d;border-radius:var(--radius);padding:1rem 1.25rem;text-align:center}
.screenshot-hint .sh-icon{font-size:1.5rem;margin-bottom:.4rem}
.screenshot-hint .sh-title{font-size:.88rem;font-weight:800;color:#92400e;margin-bottom:.3rem}
.screenshot-hint .sh-desc{font-size:.78rem;color:#b45309;line-height:1.6}
.method-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;padding:.2rem .5rem;border-radius:6px;background:rgba(255,255,255,.25);color:white;margin-top:.5rem}

@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--grad-hero);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;z-index:999}
#loading-screen .l-icon{font-size:3rem;margin-bottom:1rem}
#loading-screen h2{font-size:1.1rem;font-weight:800;margin-bottom:.3rem}
#loading-screen p{font-size:.82rem;opacity:.8}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;margin:1.25rem auto 0}
@keyframes spin{to{transform:rotate(360deg)}}

.footer-note{color:rgba(255,255,255,.5);font-size:.72rem;text-align:center;margin-top:1.25rem}
</style>
</head>

          <div class="success-row"><span class="s-label">活動名稱</span><span class="s-val" id="s-event"></span></div>
          <div class="success-row"><span class="s-label">報到編號</span><span class="s-val" id="s-num"></span></div>
          <div class="success-row"><span class="s-label">報到時間</span><span class="s-val" id="s-time"></span></div>
        </div>
        <div class="screenshot-hint">
          <div class="sh-icon">📸</div>
          <div class="sh-title">請截圖保存此畫面</div>

<script>
const FB_CONFIG={
  apiKey:"AIzaSyBldx57mnQHm8ykNaQVROJrxcBlr1gqsj0",
  authDomain:"cxo20260606.firebaseapp.com",
  databaseURL:"https://cxo20260606-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"cxo20260606",
  storageBucket:"cxo20260606.firebasestorage.app",
  messagingSenderId:"1081032555563",
  appId:"1:1081032555563:web:0822ab16f2755932803e6e"
};

let db=null, attendees={}, config={}, selectedKey=null, selectedData=null;
let failCount=0, lockUntil=0, countdownTimer=null;

// ── INIT ──
window.addEventListener('load',()=>{
  firebase.initializeApp(FB_CONFIG);
  db=firebase.database();
  db.ref('attendees').on('value',snap=>{attendees=snap.val()||{}});
  db.ref('config').once('value').then(snap=>{
    config=snap.val()||{};
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('main-wrap').style.display='flex';
    checkTimeAndShow();
    setInterval(checkTimeAndShow, 10000);
  });
});

// ── TIME CHECK ──
function checkTimeAndShow(){
  const now=new Date();
  const start=config.checkinStart||'00:00';
  const end=config.checkinEnd||'23:59';
  const eventName=config.eventName||'活動報到';
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  const startMin=sh*60+sm;
  const endMin=eh*60+em;
  const nowMin=now.getHours()*60+now.getMinutes();

  document.querySelectorAll('.event-name,.i-event-name').forEach(el=>el.textContent=eventName);
  document.getElementById('w-event-name').textContent=eventName;
  document.getElementById('i-event-name').textContent=eventName;
  document.getElementById('c-event-name').textContent=eventName;

  if(nowMin>=startMin && nowMin<endMin){
    // OPEN
    if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}
    showCard('input');
  } else if(nowMin<startMin){
    // NOT YET
    showCard('waiting');
    document.getElementById('w-icon').textContent='⏰';
    document.getElementById('w-title').textContent='報到尚未開始';
    document.getElementById('w-sub').textContent='請稍候，報到開放時間即將到來';
    document.getElementById('countdown-box').style.display='block';
    document.getElementById('closed-box').style.display='none';
    document.getElementById('time-range').textContent=`開放時間：${start} ～ ${end}`;
    startCountdown(sh,sm,now);
  } else {
    // CLOSED
    if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}
    showCard('waiting');
    document.getElementById('w-icon').textContent='🔒';
    document.getElementById('w-title').textContent='報到時間已結束';
    document.getElementById('w-sub').textContent='感謝您的參與，如有疑問請洽工作人員';
    document.getElementById('countdown-box').style.display='none';
    document.getElementById('closed-box').style.display='block';
  }
}

function startCountdown(sh,sm,now){
  if(countdownTimer)clearInterval(countdownTimer);
  countdownTimer=setInterval(()=>{
    const n=new Date();
    const target=new Date(n.getFullYear(),n.getMonth(),n.getDate(),sh,sm,0);
    const diff=target-n;
    if(diff<=0){clearInterval(countdownTimer);checkTimeAndShow();return}
    const hh=String(Math.floor(diff/3600000)).padStart(2,'0');
    const mm=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    const ss=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    document.getElementById('countdown-time').textContent=`${hh}:${mm}:${ss}`;
  },1000);
}

function showCard(name){
  ['waiting','input','confirm'].forEach(n=>{
    document.getElementById('card-'+n).style.display=n===name?'block':'none';
  });
}

// ── TAB SWITCH ──
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['id','phone'][i]===tab));
  document.getElementById('tab-id').style.display=tab==='id'?'block':'none';
  document.getElementById('tab-phone').style.display=tab==='phone'?'block':'none';
  clearErrors();
}

function clearErrors(){
  ['err-num','err-phone'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('show')});
  ['input-num','input-phone4','input-name'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('error')});
}

// ── LOCK CHECK ──
function isLocked(){
  if(Date.now()<lockUntil){
    const rem=Math.ceil((lockUntil-Date.now())/1000);
    const m=Math.floor(rem/60), s=rem%60;
    document.getElementById('lock-warn').textContent=`⚠️ 嘗試次數過多，請於 ${m}:${String(s).padStart(2,'0')} 後再試`;
    document.getElementById('lock-warn').classList.add('show');
    return true;
  }
  document.getElementById('lock-warn').classList.remove('show');
  return false;
}

function recordFail(){
  failCount++;
  const remain=5-failCount;
  if(failCount>=5){
    lockUntil=Date.now()+3*60*1000;
    failCount=0;
    document.getElementById('attempt-hint').textContent='';
  } else {
    document.getElementById('attempt-hint').textContent=`還有 ${remain} 次機會，超過將鎖定 3 分鐘`;
  }
}

// ── SEARCH BY ID ──
function searchById(){
  if(isLocked())return;
  const raw=document.getElementById('input-num').value.trim();
  if(!raw){document.getElementById('input-num').classList.add('error');return}
  const padded=raw.padStart(3,'0');
  const key='a_'+padded;
  const a=attendees[key];
  if(!a){
    document.getElementById('err-num').classList.add('show');
    document.getElementById('input-num').classList.add('error');
    recordFail();
    return;
  }
  if(a.checkedIn){showAlreadyChecked(a);return}
  selectedKey=key; selectedData=a;
  showConfirm();
}

// ── SEARCH BY PHONE ──
function searchByPhone(){
  if(isLocked())return;
  const phone4=document.getElementById('input-phone4').value.trim();
  const name=document.getElementById('input-name').value.trim();
  if(!phone4||!name){
    if(!phone4)document.getElementById('input-phone4').classList.add('error');
    if(!name)document.getElementById('input-name').classList.add('error');
    return;
  }
  const match=Object.entries(attendees).find(([k,a])=>{
    const p=a.phone||'';
    return p.slice(-4)===phone4 && a.name===name;
  });
  if(!match){
    document.getElementById('err-phone').classList.add('show');
    document.getElementById('input-phone4').classList.add('error');
    document.getElementById('input-name').classList.add('error');
    recordFail();
    return;
  }
  const[key,a]=match;
  if(a.checkedIn){showAlreadyChecked(a);return}
  selectedKey=key; selectedData=a;
  showConfirm();
}

// ── ALREADY CHECKED ──
function showAlreadyChecked(a){
  const t=formatTime(a.checkinTime);
  alert(`您（${a.name}）已於 ${t} 完成報到，無需重複操作。`);
}

// ── SHOW CONFIRM ──
function showConfirm(){
  const a=selectedData;
  const numId=String(a.numberId||'').padStart(3,'0');
  document.getElementById('c-name').textContent=a.name;
  document.getElementById('c-num').textContent=numId;
  document.getElementById('c-phone').textContent=maskPhone(a.phone);
  showCard('confirm');
}

function backToInput(){showCard('input');clearErrors()}

// ── DO CHECKIN ──
function doCheckin(){
  if(!selectedKey)return;
  const now=new Date();
  const eventName=config.eventName||'活動報到';
  db.ref('attendees/'+selectedKey).update({
    checkedIn:true,
    checkinTime:now.toISOString(),
    checkinMethod:'self'
  }).then(()=>{
    const a=selectedData;
    const numId=String(a.numberId||'').padStart(3,'0');
    document.getElementById('s-name').textContent=a.name;
    document.getElementById('s-event').textContent=eventName;
    document.getElementById('s-num').textContent=numId;
    document.getElementById('s-time').textContent=formatTime(now.toISOString());
    document.getElementById('main-wrap').style.display='none';
    document.getElementById('success-screen').style.display='block';
  });
}

// ── HELPERS ──
function maskPhone(p){if(!p||p.length<8)return p||'—';return p.slice(0,3)+'****'+p.slice(7)}

function formatTime(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const roc=d.getFullYear()-1911;
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  const hh=String(d.getHours()).padStart(2,'0');
  const mi=String(d.getMinutes()).padStart(2,'0');
  const ss=String(d.getSeconds()).padStart(2,'0');
  return`民國${roc}年${mm}月${dd}日 ${hh}:${mi}:${ss}`;
}

// Enter key support
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const tab=document.getElementById('tab-id').style.display!=='none'?'id':'phone';
  if(tab==='id')searchById(); else searchByPhone();
});
</script>
